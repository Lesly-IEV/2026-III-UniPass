{% extends 'base.html' %}

{% block content %}
<!-- CDN de Bootstrap 5 por si no está cargado en base.html -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<div class="container py-4" style="max-width: 700px;">
    <div class="mb-3">
        <a href="{% url 'mis_bicicletas' %}" class="btn btn-outline-secondary">← Volver</a>
    </div>

    <h3 class="fw-bold mb-4">⚙️ Módulo Administrativo</h3>

    <!-- Pestañas de navegación -->
    <ul class="nav nav-tabs mb-4" id="registroTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active fw-bold" id="bici-tab" data-bs-toggle="tab" data-bs-target="#bici-panel" type="button" role="tab">
                🚲 Registrar Bicicleta
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link fw-bold" id="alumno-tab" data-bs-toggle="tab" data-bs-target="#alumno-panel" type="button" role="tab">
                👤 Registrar Alumno
            </button>
        </li>
    </ul>

    <!-- Contenido de las Pestañas -->
    <div class="tab-content" id="registroTabsContent">
        
        <!-- Panel 1: Formulario de Bicicleta -->
        <div class="tab-pane fade show active" id="bici-panel" role="tabpanel" aria-labelledby="bici-tab">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h5 class="fw-bold mb-3">Alta de Bicicleta</h5>
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        <input type="hidden" name="action" value="registrar_bicicleta">
                        {{ bici_form.as_p }}
                        <button type="submit" class="btn btn-success w-100 mt-3 fw-bold">💾 Guardar Bicicleta</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Panel 2: Formulario de Alumno -->
        <div class="tab-pane fade" id="alumno-panel" role="tabpanel" aria-labelledby="alumno-tab">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h5 class="fw-bold mb-3">Alta de Alumno</h5>
                    <form method="post">
                        {% csrf_token %}
                        <input type="hidden" name="action" value="registrar_alumno">
                        {{ alumno_form.as_p }}
                        <button type="submit" class="btn btn-primary w-100 mt-3 fw-bold">👤 Registrar Alumno</button>
                    </form>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- JS de Bootstrap imprescindible para la funcionalidad de pestañas -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
