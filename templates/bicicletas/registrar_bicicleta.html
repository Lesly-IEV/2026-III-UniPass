{% extends "base.html" %}

{% block title %}Registrar bicicleta · UniPass{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 720px;">
    <a href="{% url 'mis_bicicletas' %}" class="btn btn-outline-secondary mb-3">Volver</a>
    <h1 class="h3 fw-bold mb-3">Registrar bicicleta</h1>
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success">Guardar</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
